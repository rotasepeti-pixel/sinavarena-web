# sinavarena.tr: veritabanından güncel verileri çekip siteyi üretir ve GitHub Pages'e yayınlar.
# Admin panelindeki "Web sitesi" değişiklikleri en geç bir sonraki çalışmada (2 saatte bir) siteye yansır;
# Actions sekmesinden "Run workflow" ile hemen de çalıştırılabilir.
name: Siteyi yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verileri çek
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/veri-cek.js
      - name: Siteyi üret
        run: node scripts/uret.js --alan
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
